# Registered cpp_server.server_id -> upstream authority and certificate SAN.
# Change both maps for each registered server; do not accept a client-provided IP.
map $cpp_server_id $cpp_api_upstream {
    default "";
    1 agora-cpp:8000;
}
map $cpp_server_id $cpp_api_tls_name {
    default "";
    1 agora-cpp;
}
