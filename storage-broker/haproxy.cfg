global
    log stdout format raw local0
    maxconn 4096

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout queue 30s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

# TLS passes through unchanged, including SQL's TDS pre-login TLS negotiation.
# Do not add `ssl` on binds/servers: that would terminate or double-wrap TLS.
listen mssql
    bind :1433
    server sql "${STORAGE_MSSQL_UPSTREAM}" check resolvers docker init-addr last,libc,none maxconn 512
listen elasticsearch
    bind :9200
    server es "${STORAGE_ES_UPSTREAM}" check resolvers docker init-addr last,libc,none maxconn 512
listen redis_primary
    bind :16379
    server redis "${STORAGE_REDIS_PRIMARY_UPSTREAM}" check maxconn 512
listen redis_replica_1
    bind :16380
    server redis "${STORAGE_REDIS_REPLICA_1_UPSTREAM}" check maxconn 512
listen redis_replica_2
    bind :16381
    server redis "${STORAGE_REDIS_REPLICA_2_UPSTREAM}" check maxconn 512
listen sentinel_1
    bind :26379
    server sentinel "${STORAGE_SENTINEL_1_UPSTREAM}" check maxconn 256
listen sentinel_2
    bind :26380
    server sentinel "${STORAGE_SENTINEL_2_UPSTREAM}" check maxconn 256
listen sentinel_3
    bind :26381
    server sentinel "${STORAGE_SENTINEL_3_UPSTREAM}" check maxconn 256
