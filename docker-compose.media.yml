name: agora-media
services:
  turn:
    image: coturn/coturn:4.7.0@sha256:a00afb5b4890de4df22bbe70379c6b316685dffee297d53cac1271dcb91fab93
    container_name: agora-media-relay
    restart: unless-stopped
    user: "0:0"
    entrypoint: [turnserver]
    command: [-c, /etc/coturn/turnserver.conf]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    # The config (TURN secret) stays owned by the operator with mode 0600 and the
    # Let's Encrypt key by root. Without DAC_READ_SEARCH, root in this container
    # cannot read the operator-owned config; coturn then silently starts on its
    # defaults with no TLS listener, and every relay-only call fails.
    cap_add: [NET_BIND_SERVICE, DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./.local-media/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ${MEDIA_RELAY_CERT_DIR:?Configure a trusted TLS certificate directory}/fullchain.pem:/run/tls/fullchain.pem:ro
      - ${MEDIA_RELAY_CERT_DIR:?Configure a trusted TLS certificate directory}/privkey.pem:/run/tls/privkey.pem:ro
    networks:
      agora-media:
        ipv4_address: 10.42.0.2
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      # STUN alone passes even when the config was not loaded. Browsers only use
      # turns: (TLS 5349 = 0x14E5), so require that listener as well.
      test: [CMD-SHELL, "turnutils_stunclient -p 3478 10.42.0.2 >/dev/null && grep -q ':14E5 ' /proc/net/tcp"]
      interval: 10s
      timeout: 3s
      retries: 3
networks:
  agora-media:
    name: agora-media
    internal: true
    ipam:
      config: [{subnet: 10.42.0.0/24}]
