# Included at Nginx's top level, outside the http block.
stream {
    log_format media_route '$ssl_preread_server_name $ssl_preread_alpn_protocols $upstream_addr $status';
    access_log /var/log/nginx/agora-media.log media_route;
    # Web browsers advertise h2/http/1.1. TURN TLS uses stun.turn or no ALPN.
    map "$ssl_preread_server_name:$ssl_preread_alpn_protocols" $agora_tls_upstream {
        default 127.0.0.1:9443;
        ~^frelog[.]p-e[.]kr:(?!.*(?:h2|http/1[.]1)).*$ 127.0.0.1:9445;
    }
    server {
        listen 443;
        ssl_preread on;
        proxy_protocol on;
        proxy_pass $agora_tls_upstream;
        proxy_connect_timeout 5s;
        proxy_timeout 24h;
        tcp_nodelay on;
    }
    server {
        # Strip the PROXY header before handing the untouched TLS stream to TURN.
        listen 127.0.0.1:9445 proxy_protocol;
        proxy_pass 10.42.0.2:5349;
        proxy_connect_timeout 5s;
        proxy_timeout 24h;
        tcp_nodelay on;
    }
}
